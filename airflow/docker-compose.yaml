x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-travelops360-airflow:latest}

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW__API__EXPOSE_CONFIG: "false"

    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata

    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"

    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

  env_file:
    - .env

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./../:/opt/airflow/project

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

    redis:
      condition: service_healthy


services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: always


  redis:
    image: redis:7.2-bookworm

    expose:
      - "6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: always


  airflow-apiserver:
    <<: *airflow-common

    command:
      - api-server

    ports:
      - "8081:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always


  airflow-scheduler:
    <<: *airflow-common

    command:
      - scheduler

    healthcheck:
      test:
        - CMD
        - airflow
        - jobs
        - check
        - --job-type
        - SchedulerJob
        - --local

    restart: always


  airflow-dag-processor:
    <<: *airflow-common

    command:
      - dag-processor

    healthcheck:
      test:
        - CMD
        - airflow
        - jobs
        - check
        - --job-type
        - DagProcessorJob
        - --local

    restart: always


  airflow-worker:
    <<: *airflow-common

    command:
      - celery
      - worker

    healthcheck:
      test:
        - CMD-SHELL
        - celery --app airflow.providers.celery.executors.celery_executor inspect ping -d celery@$$HOSTNAME

    restart: always


  airflow-triggerer:
    <<: *airflow-common

    command:
      - triggerer

    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type TriggererJob --local

    restart: always


  airflow-init:
    <<: *airflow-common

    user: "0:0"

    entrypoint:
      - /bin/bash

    command:
      - -c
      - |
        set -e

        echo "========================================"
        echo "TravelOps 360 Airflow Initialization"
        echo "========================================"

        echo "Creating required directories..."

        mkdir -p /opt/airflow/logs
        mkdir -p /opt/airflow/dags
        mkdir -p /opt/airflow/plugins
        mkdir -p /opt/airflow/config

        echo "Setting directory permissions..."

        chown -R 50000:0 /opt/airflow/logs
        chown -R 50000:0 /opt/airflow/dags
        chown -R 50000:0 /opt/airflow/plugins
        chown -R 50000:0 /opt/airflow/config

        echo "Checking Airflow version..."

        su airflow -c "airflow version"

        echo "Running Airflow database migration..."

        su airflow -c "airflow db migrate"

        echo "========================================"
        echo "Airflow database initialization completed."
        echo "========================================"

    environment:
      <<: *airflow-common-env

    restart: "no"


  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    command:
      - bash

    environment:
      <<: *airflow-common-env

      CONNECTION_CHECK_MAX_COUNT: "0"


  flower:
    <<: *airflow-common

    command:
      - celery
      - flower

    profiles:
      - flower

    ports:
      - "5555:5555"

    restart: always


volumes:
  postgres-db-volume: